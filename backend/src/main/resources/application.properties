spring.application.name=backend
server.port=${PORT:8080}

# Clerk OAuth2 Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://upright-boa-48.clerk.accounts.dev
spring.security.oauth2.resourceserver.jwt.audience=api
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://upright-boa-48.clerk.accounts.dev/.well-known/jwks.json
logging.level.org.springframework.security=DEBUG

# Frontend URL (used for CORS)
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Clerk Webhook Configuration
clerk.webhook.secret=${CLERK_WEBHOOK_SECRET:}

# Supabase Configuration
supabase.url=${SUPABASE_URL:https://xohqmhnpzcbjaqucodrz.supabase.co}
supabase.anon.key=${SUPABASE_ANON_KEY:}
supabase.service.role.key=${SUPABASE_SERVICE_ROLE_KEY:}

# Supabase PostgreSQL Database (Session Pooler for IPv4)
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Database connection pool settings for resilience
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ---------------------------------------------------------------------------
# Self-hosted job queue (replaces Google Cloud Tasks)
# ---------------------------------------------------------------------------
# Jobs are persisted in the application database and drained in-process by
# com.richwavelet.backend.worker.JobDispatcher. No external queue service.
queue.enabled=${QUEUE_ENABLED:true}
queue.batch-size=${QUEUE_BATCH_SIZE:1}
queue.dispatch-interval-ms=${QUEUE_DISPATCH_INTERVAL_MS:5000}
queue.initial-delay-ms=${QUEUE_INITIAL_DELAY_MS:15000}
queue.lease-seconds=${QUEUE_LEASE_SECONDS:3600}

# Worker endpoint. Leave worker.base-url blank to call this same instance over
# loopback (single-node VPS); set it to the public base URL when the dispatcher
# and worker run as separate containers/hosts. worker.auth-token is the shared
# secret that authenticates the dispatcher against /api/tasks/**.
worker.base-url=${WORKER_BASE_URL:}
worker.auth-token=${WORKER_AUTH_TOKEN:}

# Gemini Configuration
# gemini.base-url defaults to Google's generativelanguage endpoint; point it at a
# self-hosted Gemini-compatible gateway to keep inference on your own network.
gemini.base-url=${GEMINI_BASE_URL:}
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:600}
gemini.structured-output=${GEMINI_STRUCTURED_OUTPUT:true}
gemini.inline-max-bytes=${GEMINI_INLINE_MAX_BYTES:20971520}

# YouTube Data API v3 Configuration
youtube.api.key=${YOUTUBE_API_KEY:}

# Video Processing Configuration
video.temp-dir=${VIDEO_TEMP_DIR:/tmp/video-processing}
video.max-upload-size-mb=${VIDEO_MAX_UPLOAD_SIZE_MB:500}
video.max-ad-count=${VIDEO_MAX_AD_COUNT:5}

# Multipart file upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
