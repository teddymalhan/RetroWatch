# Test profile: run the full Spring context with no external dependencies.
# Overrides only the datasource + queue settings; everything else comes from
# src/main/resources/application.properties.

spring.datasource.url=jdbc:h2:mem:retrowatch;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# No worker dispatch or outbound calls during context tests
queue.enabled=false
gemini.api-key=
worker.auth-token=
