# RetroWatch — self-hosted stack
#
# Everything RetroWatch needs runs from this one file on a plain VPS: the Spring Boot
# application (which serves the built React SPA), PostgreSQL, MinIO for object storage,
# and optionally Caddy for automatic HTTPS.
#
#   Local / LAN:        cp .env.example .env  (fill it in)  &&  docker compose up -d --build
#   Public VPS with TLS: set DOMAIN + ACME_EMAIL in .env, then
#                        docker compose --profile tls up -d --build
#
# Full walkthrough: deploy/README.md

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retrowatch}
      POSTGRES_USER: ${POSTGRES_USER:-retrowatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retrowatch} -d ${POSTGRES_DB:-retrowatch}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Deliberately not published: only the app needs to reach the database.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    volumes:
      - minio-data:/data
    ports:
      # Admin console on loopback only — reach it through an SSH tunnel:
      #   ssh -L 9001:127.0.0.1:9001 user@vps   then open http://localhost:9001
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${S3_ACCESS_KEY}' '${S3_SECRET_KEY}' &&
      mc mb --ignore-existing local/videos local/ads local/processed-videos &&
      echo 'RetroWatch buckets ready'
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the SPA at build time.
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?VITE_CLERK_PUBLISHABLE_KEY must be set in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PORT: ${APP_PORT:-8080}

      # Public origin, used for CORS.
      FRONTEND_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}

      # Database (the compose-managed PostgreSQL above)
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-retrowatch}
      DATABASE_USERNAME: ${POSTGRES_USER:-retrowatch}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}

      # Object storage -> MinIO
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PATH_STYLE_ACCESS: "true"
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}

      # Shared secret between the in-process job dispatcher and the worker endpoint.
      WORKER_AUTH_TOKEN: ${WORKER_AUTH_TOKEN:?WORKER_AUTH_TOKEN must be set in .env}

      # Auth
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-}

      # AI (leave GEMINI_BASE_URL empty for Google, or point it at a self-hosted gateway)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}

      # YouTube metadata
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}

      # Video pipeline
      VIDEO_TEMP_DIR: /tmp/video-processing
      VIDEO_MAX_UPLOAD_SIZE_MB: ${VIDEO_MAX_UPLOAD_SIZE_MB:-500}
    volumes:
      # FFmpeg scratch space; keeps large intermediates off the container layer.
      - video-temp:/tmp/video-processing
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api-docs"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  # Reverse proxy with automatic Let's Encrypt certificates.
  # Only started with: docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Defaults to "localhost" so `--profile tls` still starts on a LAN box (Caddy
      # uses its internal CA there). Set DOMAIN to your public hostname for a real
      # Let's Encrypt certificate.
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  minio-data:
  video-temp:
  caddy-data:
  caddy-config:
