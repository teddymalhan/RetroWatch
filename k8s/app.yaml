# RetroWatch on a local kind cluster (`kind create cluster --config kind-config.yaml`, then `tilt up`).
#
# This is the Kubernetes path for local development and for a k3s/k0s VPS. The
# primary self-hosting path is docker-compose.yml at the repository root; see
# deploy/README.md.
#
# Provide every value through the `app-secrets` Secret (create it from .env).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: full-stack-app
  labels:
    app: full-stack-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: full-stack-app
  template:
    metadata:
      labels:
        app: full-stack-app
    spec:
      containers:
        - name: full-stack-app
          image: full-stack-app:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: FRONTEND_URL
              value: "http://localhost:8080"
            - name: STORAGE_BACKEND
              value: "s3"
            - name: S3_ENDPOINT
              value: "http://minio:9000"
            - name: S3_PATH_STYLE_ACCESS
              value: "true"
          envFrom:
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api-docs
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: full-stack-app
  labels:
    app: full-stack-app
spec:
  type: NodePort
  selector:
    app: full-stack-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
# Fill this in from your .env before applying:
#
#   kubectl create secret generic app-secrets \
#     --from-literal=DATABASE_URL=jdbc:postgresql://postgres:5432/retrowatch \
#     --from-literal=DATABASE_USERNAME=retrowatch \
#     --from-literal=DATABASE_PASSWORD=... \
#     --from-literal=WORKER_AUTH_TOKEN=... \
#     --from-literal=S3_ACCESS_KEY=... \
#     --from-literal=S3_SECRET_KEY=... \
#     --from-literal=SUPABASE_URL=... \
#     --from-literal=SUPABASE_ANON_KEY=... \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY=... \
#     --from-literal=VITE_CLERK_PUBLISHABLE_KEY=... \
#     --from-literal=CLERK_WEBHOOK_SECRET=... \
#     --from-literal=GEMINI_API_KEY=... \
#     --from-literal=YOUTUBE_API_KEY=... \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData: {}
