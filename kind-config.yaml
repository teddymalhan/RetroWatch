# Local Kubernetes cluster for running RetroWatch on a machine or VPS with kind.
#
#   kind create cluster --config kind-config.yaml
#   tilt up
#
# No cloud credentials are mounted: the app talks to the database, object storage and
# Gemini endpoint configured through environment variables (see k8s/app.yaml).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: full-stack-spring
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
